<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wrongulator</title>
<link rel="icon" type="image/png" href="logo1.png">
<style>
  :root{
    --paper: #FBF7EE;
    --ink: #182B27;
    --ink-soft: #4B5C58;

    --case: #1F7A72;
    --case-dark: #124A45;
    --case-darker: #0C332F;
    --case-sheen: rgba(255,255,255,0.16);

    --screen-bg: #0B1F16;
    --screen-fg: #7CFFB2;
    --screen-fg-dim: rgba(124,255,178,0.4);

    --key-equals: #FF5D5D;
    --key-equals-ink: #3A0A0A;
    --key-op: #F2A65A;
  }

  *{ box-sizing: border-box; }
  html, body{ overflow-x: hidden; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    position: relative;
  }

  /* ---------- floating math background (same species as the calculator) ---------- */
  .math-bg{
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  .math-bg .sym{
    position: absolute;
    top: 100%;
    left: var(--left);
    font-weight: 800;
    font-family: "Courier New", Consolas, monospace;
    color: var(--sym-color);
    text-shadow: 0 0 14px var(--sym-color);
    -webkit-text-stroke: 1px rgba(255,255,255,0.35);
    opacity: 0;
    will-change: transform, opacity;
    animation-name: symbolDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--dur);
    animation-delay: var(--delay);
  }
  @keyframes symbolDrift{
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--op); }
    92%  { opacity: var(--op); }
    100% { transform: translate(var(--dx), -125vh) rotate(var(--rot)); opacity: 0; }
  }

  /* ---------- card ---------- */
  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .logo-wrap{
    width: 92px;
    height: 92px;
    margin: 0 auto 22px;
    border-radius: 26px;
    background: linear-gradient(160deg, var(--case) 0%, var(--case-dark) 100%);
    box-shadow:
      0 20px 34px -16px rgba(12,51,47,0.5),
      inset 0 2px 0 var(--case-sheen);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: logoFloat 3.6s ease-in-out infinite;
  }
  @keyframes logoFloat{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-2deg); }
  }
  .logo-wrap img{
    width: 58px;
    height: 58px;
    object-fit: contain;
    display:block;
  }

  h1{
    font-size: clamp(2.1rem, 8vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    color: var(--case-darker);
  }
  h1 .accent{ color: var(--key-equals); }

  .tagline{
    margin: 0 auto 30px;
    max-width: 360px;
    color: var(--ink-soft);
    font-size: 1.02rem;
    line-height: 1.55;
  }

  /* ---------- boot screen ---------- */
  .screen{
    position:relative;
    background: var(--screen-bg);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 26px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.55), 0 16px 30px -20px rgba(12,51,47,0.4);
    min-height: 30px;
    display:flex;
    align-items:center;
    justify-content: flex-start;
  }
  .screen .line{
    font-family: "Courier New", Consolas, monospace;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--screen-fg);
    text-shadow: 0 0 8px rgba(124,255,178,0.55);
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    border-right: 2px solid var(--screen-fg);
    animation: caretblink 0.9s step-end infinite;
    padding-right: 4px;
  }
  @keyframes caretblink{
    0%, 100% { border-color: var(--screen-fg); }
    50% { border-color: transparent; }
  }

  /* ---------- the button ---------- */
  .launch{
    position: relative;
    border: none;
    width: 100%;
    padding: 22px 0;
    border-radius: 18px;
    background: var(--key-equals);
    color: var(--key-equals-ink);
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 6px 0 #a63333, 0 18px 30px -14px rgba(166,51,51,0.55);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    animation: pulseGlow 2.4s ease-in-out infinite;
  }
  .launch:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 0 #a63333, 0 22px 34px -14px rgba(166,51,51,0.6);
  }
  .launch:active,
  .launch.pressed{
    transform: translateY(6px);
    box-shadow: 0 0 0 #a63333, 0 10px 18px -12px rgba(166,51,51,0.5);
  }
  .launch:disabled{
    cursor: default;
    animation: none;
  }
  @keyframes pulseGlow{
    0%, 100% { box-shadow: 0 6px 0 #a63333, 0 18px 30px -14px rgba(166,51,51,0.55); }
    50% { box-shadow: 0 6px 0 #a63333, 0 18px 38px -10px rgba(255,93,93,0.75); }
  }

  .fineprint{
    margin-top: 16px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="math-bg" id="mathBg"></div>

<div class="stage">
  <div class="logo-wrap">
    <img src="logo1.png" alt="Wrongulator logo">
  </div>

  <h1>Wrong<span class="accent">ulator</span></h1>
  <p class="tagline">A calculator that answers with total confidence. Accuracy not included.</p>

  <div class="screen">
    <div class="line" id="bootLine">BOOTING WR-04&hellip;</div>
  </div>

  <button class="launch" id="launchBtn" disabled>Prove Me Wrong</button>
  <p class="fineprint">It won't apologize. It also won't recalculate.</p>
</div>

<script>
(function(){

  // ---------------- Floating math background ----------------
  function spawnSymbol(container, colors, symbols){
    const el = document.createElement('div');
    el.className = 'sym';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    const size = 22 + Math.random() * 50;
    const dur = 10 + Math.random() * 14;
    const drift = (Math.random() - 0.5) * 260;
    const rot = (Math.random() - 0.5) * 540;
    const opacity = 0.3 + Math.random() * 0.3;
    const left = Math.random() * 100;
    const color = colors[Math.floor(Math.random() * colors.length)];

    el.style.setProperty('--left', left + '%');
    el.style.setProperty('--dx', drift + 'px');
    el.style.setProperty('--rot', rot + 'deg');
    el.style.setProperty('--dur', dur + 's');
    el.style.setProperty('--delay', '0s');
    el.style.setProperty('--op', opacity);
    el.style.setProperty('--sym-color', color);
    el.style.fontSize = size + 'px';

    container.appendChild(el);
    setTimeout(() => el.remove(), (dur * 1000) + 200);
  }

  function startMathBackground(){
    const container = document.getElementById('mathBg');
    if (!container) return;
    const symbols = ['+', '\u2212', '\u00d7', '\u00f7', '='];
    const colors = ['#1F7A72', '#F2A65A', '#FF5D5D', '#0FA968', '#124A45', '#B8452F'];

    for (let i = 0; i < 14; i++){
      setTimeout(() => spawnSymbol(container, colors, symbols), i * 260);
    }
    setInterval(() => spawnSymbol(container, colors, symbols), 650);
  }
  startMathBackground();

  // ---------------- Boot sequence ----------------
  const bootLine = document.getElementById('bootLine');
  const launchBtn = document.getElementById('launchBtn');

  const bootMessages = [
    'BOOTING WR-04\u2026',
    'CALIBRATING CONFIDENCE\u2026',
    'SUPPRESSING DOUBT\u2026',
    'READY. AS ALWAYS.'
  ];

  let step = 0;
  function nextBootMessage(){
    bootLine.textContent = bootMessages[step];
    step++;
    if (step < bootMessages.length){
      setTimeout(nextBootMessage, 650);
    } else {
      launchBtn.disabled = false;
    }
  }
  setTimeout(nextBootMessage, 300);

  // ---------------- Launch ----------------
  launchBtn.addEventListener('click', () => {
    if (launchBtn.disabled) return;
    launchBtn.disabled = true;
    launchBtn.classList.add('pressed');
    launchBtn.textContent = 'Calculating\u2026';
    bootLine.textContent = 'REDIRECTING. TRY NOT TO BE RIGHT.';

    setTimeout(() => {
      window.location.href = 'calculator.html';
    }, 850);
  });

})();
</script>

</body>
</html>
